name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    env:
      CGO_ENABLED: '0'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Test
        run: go test ./...

      - name: Generate Windows resources
        run: go generate ./...

      - name: Build CLI
        shell: cmd
        run: go build -trimpath -ldflags "-s -w" -o bin\rdpmux.exe .\cmd\rdpmux

      - name: Build GUI
        shell: cmd
        run: go build -trimpath -ldflags "-s -w -H windowsgui" -o bin\rdpmuxgui.exe .\cmd\rdpmuxgui

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            bin\rdpmux.exe
            bin\rdpmuxgui.exe
