@USAGE:=用法：
@RDPWInst.exe [-l|-i[-s][-o]|-w[url]|-u[-k]|-r] [-lang en-US|zh-CN]=RDPWInst.exe [-l|-i[-s][-o]|-w[url]|-u[-k]|-r] [-lang en-US|zh-CN]
@-i          install wrapper to Program Files folder (default)=-i          安装 wrapper 到 Program Files 目录（默认）
@-i -s       install wrapper to System32 folder=-i -s       安装 wrapper 到 System32 目录
@-i -o       online install mode (loads latest INI file)=-i -o       在线安装模式（加载最新 INI 文件）
@-w          get latest update for INI file=-w          获取 INI 文件的最新更新
@-w URL      get latest update for INI file from custom source=-w URL      从自定义来源获取 INI 文件的最新更新
@-u          uninstall wrapper=-u          卸载 wrapper
@-u -k       uninstall wrapper and keep settings=-u -k       卸载 wrapper 并保留设置
@-r          force restart Terminal Services=-r          强制重启 Terminal Services
@-lang CODE  set interface language (en-US or zh-CN)=-lang CODE  设置界面语言（en-US 或 zh-CN）
